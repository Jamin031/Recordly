name: Temporary click layout integration

on:
  push:
    branches:
      - feature/click-layout-transition
    paths:
      - .github/workflows/temp-click-layout-integration.yml

permissions:
  contents: write

jobs:
  patch-video-playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/click-layout-transition
          fetch-depth: 0
      - name: Patch VideoPlayback safely
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/components/video-editor/VideoPlayback.tsx")
          text = path.read_text()
          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)
          replace_once('import {\n\tgetCropMatchedWebcamHeightPercent,', 'import type { LayoutEvent } from "./layoutTransitions";\nimport { applyVideoPlaybackLayoutAtTime, getRenderableLayoutEvents } from "./videoPlaybackLayout";\nimport {\n\tgetCropMatchedWebcamHeightPercent,')
          replace_once('\twebcamVideoPath?: string | null;\n\ttrimRegions?: TrimRegion[];', '\twebcamVideoPath?: string | null;\n\tlayoutEvents?: LayoutEvent[];\n\ttrimRegions?: TrimRegion[];')
          replace_once('\t\t\twebcamVideoPath,\n\t\t\ttrimRegions = [],', '\t\t\twebcamVideoPath,\n\t\t\tlayoutEvents,\n\t\t\ttrimRegions = [],')
          replace_once('\t\tconst currentTimeRef = useRef(0);\n\t\tconst zoomRegionsRef', '\t\tconst currentTimeRef = useRef(0);\n\t\tconst layoutEventsRef = useRef<LayoutEvent[] | undefined>(layoutEvents);\n\t\tconst zoomRegionsRef')
          replace_once('\t\tuseEffect(() => {\n\t\t\tzoomRegionsRef.current = zoomRegions;\n\t\t}, [zoomRegions]);', '\t\tuseEffect(() => {\n\t\t\tlayoutEventsRef.current = layoutEvents;\n\t\t}, [layoutEvents]);\n\n\t\tuseEffect(() => {\n\t\t\tzoomRegionsRef.current = zoomRegions;\n\t\t}, [zoomRegions]);')
          old_guard = '\t\t\t\tif (!bubble || !bubbleInner || !overlay || !webcamEnabled || !webcamVideoPath) {\n\t\t\t\t\tif (bubble) {\n\t\t\t\t\t\tbubble.style.display = "none";\n\t\t\t\t\t}\n\t\t\t\t\treturn;\n\t\t\t\t}'
          new_guard = '\t\t\t\tif (!bubble || !bubbleInner || !overlay || !webcamEnabled || !webcamVideoPath) {\n\t\t\t\t\tconst videoEffectsContainer = videoEffectsContainerRef.current;\n\t\t\t\t\tconst cursorContainer = cursorContainerRef.current;\n\t\t\t\t\tif (videoEffectsContainer) videoEffectsContainer.alpha = 1;\n\t\t\t\t\tif (cursorContainer) cursorContainer.alpha = 1;\n\t\t\t\t\tif (bubble) bubble.style.display = "none";\n\t\t\t\t\treturn;\n\t\t\t\t}'
          replace_once(old_guard, new_guard)
          marker = '\t\t\t\tconst scaledMargin = scaleWebcamOverlayPixels(webcamMargin, overlay.clientWidth);'
          injection = '''\t\t\t\tconst videoEffectsContainer = videoEffectsContainerRef.current;
\t\t\t\tconst cursorContainer = cursorContainerRef.current;
\t\t\t\tconst renderableLayoutEvents = getRenderableLayoutEvents(layoutEventsRef.current, true);
\t\t\t\tif (renderableLayoutEvents !== undefined && videoEffectsContainer) {
\t\t\t\t\tconst layoutFrame = applyVideoPlaybackLayoutAtTime(currentTimeRef.current, renderableLayoutEvents, {
\t\t\t\t\t\tscreen: videoEffectsContainer,
\t\t\t\t\t\tcursor: cursorContainer,
\t\t\t\t\t\twebcamStyle: bubble.style,
\t\t\t\t\t\tstageWidth: overlay.clientWidth,
\t\t\t\t\t\tstageHeight: overlay.clientHeight,
\t\t\t\t\t\twebcamAspectRatio: webcamHeight > 0 ? webcamWidth / webcamHeight : undefined,
\t\t\t\t\t});
\t\t\t\t\tif (layoutFrame) {
\t\t\t\t\t\tconst width = layoutFrame.webcam.width;
\t\t\t\t\t\tconst height = layoutFrame.webcam.height;
\t\t\t\t\t\tconst scaledRadius = getWebcamCornerRadiusPx(webcamRoundness, width, height);
\t\t\t\t\t\tconst squirclePath = getSquircleSvgPath({ x: 0, y: 0, width, height, radius: scaledRadius });
\t\t\t\t\t\tbubble.style.display = "block";
\t\t\t\t\t\tbubble.style.aspectRatio = `${width} / ${height}`;
\t\t\t\t\t\tbubble.style.filter = getWebcamShadowFilter(Math.min(width, height), webcamShadow);
\t\t\t\t\t\tbubble.style.borderRadius = "0px";
\t\t\t\t\t\tbubble.style.boxShadow = "none";
\t\t\t\t\t\tbubbleInner.style.borderRadius = "0px";
\t\t\t\t\t\tbubbleInner.style.overflow = "hidden";
\t\t\t\t\t\tbubbleInner.style.contain = "paint";
\t\t\t\t\t\tbubbleInner.style.clipPath = `path('${squirclePath}')`;
\t\t\t\t\t\tbubbleInner.style.setProperty("-webkit-clip-path", `path('${squirclePath}')`);
\t\t\t\t\t\treturn;
\t\t\t\t\t}
\t\t\t\t}
\t\t\t\tif (videoEffectsContainer) videoEffectsContainer.alpha = 1;
\t\t\t\tif (cursorContainer) cursorContainer.alpha = 1;
\t\t\t\tbubble.style.opacity = "1";
'''
          replace_once(marker, injection + marker)
          path.write_text(text)
      - name: Validate diff
        run: git diff --check
      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-click-layout-integration.yml
          git add src/components/video-editor/VideoPlayback.tsx .github/workflows/temp-click-layout-integration.yml
          git commit -m "feat: wire click layout into video preview"
          git push origin HEAD:feature/click-layout-transition
